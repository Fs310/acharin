{% extends "Home/management/base.html" %}
{% block title %}{{ title }} | مدیریت آچارین{% endblock %}
{% block body %}
<div class="management-toolbar">
    <div>
        <a class="back-link" href="{% url 'home:management_dashboard' %}">← داشبورد</a>
        <h2>{{ title }}</h2>
    </div>
    <a class="primary-button" href="{% url 'home:management_create' section %}">＋ افزودن</a>
</div>

<div class="management-table-wrap">
<table class="management-table">
    <thead>
        <tr>
            <th>#</th>
            <th>مورد</th>
            <th>عملیات</th>
        </tr>
    </thead>
    <tbody>
    {% for object in objects %}
        <tr>
            <td>{{ object.pk }}</td>
            <td>{{ object }}</td>
            <td class="actions">
                <a href="{% url 'home:management_edit' section object.pk %}">ویرایش</a>
                <a class="danger-link" href="{% url 'home:management_delete' section object.pk %}">حذف</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="3" class="empty-state">موردی ثبت نشده است.</td></tr>
    {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}

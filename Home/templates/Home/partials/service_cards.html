<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% for service in page_obj %}

    <article class="service-card">

        <a href="{% url 'home:detail_service' service.id %}"
           aria-label="مشاهده جزئیات {{ service.title }}">

            <div class="img-box">

                <img src="{{ service.icon.url }}"
                     alt=" {{ service.title }} در مشهد"
                     loading="lazy"
                     decoding="async">

            </div>

            <div class="card-body">

                <h3 class="card-title">
                    <span class="mobile-break">تعمیر </span>{{ service.title|cut:"تعمیر " }}
                </h3>

                <p class="card-text">
                    {{ service.description }}
                </p>

                <span class="read-more">

                مشاهده جزئیات

                <i class="bi bi-arrow-left"
                   aria-hidden="true"></i>

            </span>

            </div>

        </a>

    </article>

{% endfor %}
</body>
</html>

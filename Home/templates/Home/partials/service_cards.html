{% for service in page_obj %}

    <article class="service-card">

        <a href="{% url 'home:detail_service' service.id %}"
           aria-label="مشاهده جزئیات {{ service.title }}">

            <div class="img-box">

                {% if service.icon %}
                    <img src="{{ service.icon.url }}"
                         alt="تعمیر {{ service.title }} در مشهد"
                         loading="lazy"
                         decoding="async">
                {% endif %}

            </div>

            <div class="card-body">

                <h3 class="card-title">
                    {{ service.title }}
                </h3>

                <p class="card-text">
                    {{ service.description }}
                </p>

                <span class="read-more">
                    مشاهده جزئیات
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                </span>

            </div>

        </a>

    </article>

{% endfor %}

{% extends '_base.html' %}
{% load static %}


{% block body %}


    <section class="login-section">

        <div class="login-container">
            <div class="login-form-box">
                <h2>بازیابی رمز عبور</h2>
                <p>لطفا ایمیل خود را جهت بازیابی رمز عبور وارد کنید</p>
                <form method="post">
                    {% csrf_token %}
                    <input name="email" , placeholder="ایمیل" , id="email">                    <div class="login-link">
                    </div>

                    <button type="submit">
                        ارسال لینک بازیابی
                    </button>

                </form>
                <div class="login-link">
                    <a href="{% url 'accounts:login' %}">ورود به حساب کاربری</a>
                </div>
            </div>
            <div class="pass-banner">
            </div>
        </div>
    </section>
{% endblock %}
